<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lorem Ipsum Site Scan</title>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#2563eb; --bad:#b42318; --good:#067647; --card:#f6f8fa; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161b22; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#4c8dff; --bad:#ff7b72; --good:#56d364; --card:#1f252d; } }
  body { margin: 0; padding: 24px; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); max-width: 960px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 16px; word-break: break-all; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  button, input { padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); font-size: 13px; }
  button { cursor: pointer; } button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  input { width: 80px; }
  progress { width: 100%; height: 8px; }
  #status { color: var(--muted); margin: 6px 0 16px; }
  .summary { display: flex; gap: 12px; margin-bottom: 18px; }
  .stat { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
  .stat b { display: block; font-size: 22px; }
  .bad { color: var(--bad); } .good { color: var(--good); }
  .page { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
  .page a { color: var(--accent); word-break: break-all; font-weight: 600; }
  .snip { color: var(--muted); margin-top: 4px; font-size: 13px; }
  .snip em { color: var(--fg); background: rgba(250, 204, 21, .35); font-style: normal; }
</style>
</head>
<body>
  <h1>Lorem Ipsum Site Scan</h1>
  <div class="sub" id="origin"></div>
  <div class="bar">
    <label>Max pages <input id="max" type="number" value="300" min="1" max="5000"></label>
    <button class="primary" id="start">Start scan</button>
    <button id="stop" disabled>Stop</button>
    <button id="csv" disabled>Export CSV</button>
  </div>
  <progress id="prog" value="0" max="1"></progress>
  <div id="status">Ready.</div>
  <div class="summary">
    <div class="stat"><b id="nScanned">0</b>Pages scanned</div>
    <div class="stat"><b id="nFlagged" class="good">0</b>Pages with lorem ipsum</div>
    <div class="stat"><b id="nQueued">0</b>Discovered</div>
    <div class="stat"><b id="nErr">0</b>Failed / skipped</div>
  </div>
  <div id="results"></div>
  <script src="detect.js"></script>
  <script src="report.js"></script>
</body>
</html>
