<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#2563eb; --bad:#b42318; --good:#067647; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1f24; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#4c8dff; --bad:#ff7b72; --good:#56d364; } }
  body { width: 340px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .host { color: var(--muted); margin-bottom: 12px; word-break: break-all; }
  button { width: 100%; padding: 9px; margin-bottom: 8px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); font-size: 13px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #result { margin-top: 6px; }
  .bad { color: var(--bad); font-weight: 600; }
  .good { color: var(--good); font-weight: 600; }
  .hit { border-top: 1px solid var(--line); padding: 6px 0; }
  .hit small { color: var(--muted); display: block; }
</style>
</head>
<body>
  <h1>Lorem Ipsum Checker</h1>
  <div class="host" id="host">…</div>
  <button class="primary" id="page">Scan this page</button>
  <button id="site">Scan entire website</button>
  <div id="result"></div>
  <script src="detect.js"></script>
  <script src="popup.js"></script>
</body>
</html>
